# ============================================================
# TorreClou — Dokploy deployment
# ============================================================
# Differences from the local docker-compose.yml:
#   * No published ports. Traefik (managed by Dokploy) routes to the api
#     service on port 8080 via the domain configured in the Dokploy UI.
#     Postgres and Redis stay internal to the compose network.
#   * No container_name. Dokploy derives names per project/environment,
#     and fixed names collide with other stacks on the same Docker host.
#   * No loki/prometheus/grafana. The server already runs a central
#     observability stack (grafana.gitnasr.com / prom.gitnasr.com /
#     alloy.gitnasr.com); duplicating it here would waste memory.
#   * Secrets come from Dokploy's environment settings, never this file.
#
# Everything else mirrors docker-compose.yml, including the healthcheck
# and startup-ordering fixes: workers wait for the api to report healthy
# so EF migrations land before Hangfire touches the schema.

services:
  postgres:
    image: postgres:15-alpine
    command: postgres -c max_connections=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torrenclo}
      POSTGRES_USER: ${POSTGRES_USER:-torrenclo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torrenclo_user} -d ${POSTGRES_DB:-torrenclo}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: TorreClou.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # Listen on 3000 rather than the image default of 8080: Dokploy's generated
      # domains default to port 3000, and that port number is not settable through
      # the API. The local docker-compose.yml is unaffected and still uses 8080.
      - ASPNETCORE_URLS=http://+:3000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-torrenclo};Username=${POSTGRES_USER:-torrenclo_user};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379
      - TORRENT_DOWNLOAD_PATH=${TORRENT_DOWNLOAD_PATH:-/app/downloads}
      - Jwt__Key=${JWT_SECRET:?JWT_SECRET is required}
      - Jwt__Issuer=${JWT_ISSUER:-TorrenClou_API}
      - Jwt__Audience=${JWT_AUDIENCE:-TorrenClou_Client}
      - Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - APPLY_MIGRATIONS=${APPLY_MIGRATIONS:-true}
      - Observability__EnablePrometheus=${OBSERVABILITY_ENABLE_PROMETHEUS:-true}
      - Observability__EnableTracing=${OBSERVABILITY_ENABLE_TRACING:-true}
      - UploadRouting__EnableFailover=${UPLOAD_ROUTING_ENABLE_FAILOVER:-true}
      - UploadRouting__MaxFailoverAttempts=${UPLOAD_ROUTING_MAX_FAILOVER_ATTEMPTS:-3}
      - UploadRouting__FailureThreshold=${UPLOAD_ROUTING_FAILURE_THRESHOLD:-3}
      - Observability__LokiUrl=${OBSERVABILITY_LOKI_URL:-}
      - Observability__OtlpEndpoint=${OBSERVABILITY_OTLP_ENDPOINT:-}
      - Observability__OtlpHeaders=${OBSERVABILITY_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - downloads:/app/downloads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  torrent-worker:
    build:
      context: .
      dockerfile: TorreClou.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-torrenclo};Username=${POSTGRES_USER:-torrenclo_user};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379
      - Hangfire__WorkerCount=${HANGFIRE_WORKER_COUNT:-10}
      - TORRENT_DOWNLOAD_PATH=${TORRENT_DOWNLOAD_PATH:-/app/downloads}
      - Observability__EnablePrometheus=${OBSERVABILITY_ENABLE_PROMETHEUS:-true}
      - Observability__EnableTracing=${OBSERVABILITY_ENABLE_TRACING:-true}
      - UploadRouting__EnableFailover=${UPLOAD_ROUTING_ENABLE_FAILOVER:-true}
      - UploadRouting__MaxFailoverAttempts=${UPLOAD_ROUTING_MAX_FAILOVER_ATTEMPTS:-3}
      - UploadRouting__FailureThreshold=${UPLOAD_ROUTING_FAILURE_THRESHOLD:-3}
      - Observability__LokiUrl=${OBSERVABILITY_LOKI_URL:-}
      - Observability__OtlpEndpoint=${OBSERVABILITY_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped

  googledrive-worker:
    build:
      context: .
      dockerfile: TorreClou.GoogleDrive.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-torrenclo};Username=${POSTGRES_USER:-torrenclo_user};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379
      - TORRENT_DOWNLOAD_PATH=${TORRENT_DOWNLOAD_PATH:-/app/downloads}
      - Hangfire__WorkerCount=${HANGFIRE_WORKER_COUNT:-10}
      - Observability__EnablePrometheus=${OBSERVABILITY_ENABLE_PROMETHEUS:-true}
      - Observability__EnableTracing=${OBSERVABILITY_ENABLE_TRACING:-true}
      - UploadRouting__EnableFailover=${UPLOAD_ROUTING_ENABLE_FAILOVER:-true}
      - UploadRouting__MaxFailoverAttempts=${UPLOAD_ROUTING_MAX_FAILOVER_ATTEMPTS:-3}
      - UploadRouting__FailureThreshold=${UPLOAD_ROUTING_FAILURE_THRESHOLD:-3}
      - Observability__LokiUrl=${OBSERVABILITY_LOKI_URL:-}
      - Observability__OtlpEndpoint=${OBSERVABILITY_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped

  s3-worker:
    build:
      context: .
      dockerfile: TorreClou.S3.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-torrenclo};Username=${POSTGRES_USER:-torrenclo_user};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379
      - TORRENT_DOWNLOAD_PATH=${TORRENT_DOWNLOAD_PATH:-/app/downloads}
      - Hangfire__WorkerCount=${HANGFIRE_WORKER_COUNT:-10}
      - Observability__EnablePrometheus=${OBSERVABILITY_ENABLE_PROMETHEUS:-true}
      - Observability__EnableTracing=${OBSERVABILITY_ENABLE_TRACING:-true}
      - UploadRouting__EnableFailover=${UPLOAD_ROUTING_ENABLE_FAILOVER:-true}
      - UploadRouting__MaxFailoverAttempts=${UPLOAD_ROUTING_MAX_FAILOVER_ATTEMPTS:-3}
      - UploadRouting__FailureThreshold=${UPLOAD_ROUTING_FAILURE_THRESHOLD:-3}
      - Observability__LokiUrl=${OBSERVABILITY_LOKI_URL:-}
      - Observability__OtlpEndpoint=${OBSERVABILITY_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  downloads:
