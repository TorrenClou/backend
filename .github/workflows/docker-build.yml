name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
    # Fires only for a tag pushed by a human. Release Please tags with
    # GITHUB_TOKEN, and GitHub does not start runs from that token's events —
    # see the tag-release job for how automated releases get their semver tags.
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Compile before building any image. Previously the only compilation happened
  # inside the Docker build stages, so a break was reported four times over as
  # four failed image builds instead of once, with the compiler output buried.
  # There is no test project yet; when one lands, it runs here.
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore TorrenClou.sln

      - name: Build
        run: dotnet build TorrenClou.sln -c Release --no-restore

      # Generated from the annotated option types rather than written by hand.
      # Running it on every build means a change to the configuration surface
      # cannot pass CI while silently failing to generate.
      - name: Export the configuration schema
        run: |
          set -euo pipefail
          dotnet TorrenClou.API/bin/Release/net9.0/TorrenClou.API.dll --dump-config-schema > config-schema.json
          entries=$(jq '.entries | length' config-schema.json)
          echo "Documented ${entries} configuration values."
          jq -e '.entries | length > 0' config-schema.json > /dev/null

      - name: Upload the configuration schema
        uses: actions/upload-artifact@v4
        with:
          name: config-schema
          path: config-schema.json
          if-no-files-found: error

  images:
    name: ${{ matrix.service.name }}
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: .
            dockerfile: TorrenClou.API/Dockerfile
          - name: worker
            context: .
            dockerfile: TorrenClou.Worker/Dockerfile
          - name: gdrive-worker
            context: .
            dockerfile: TorrenClou.GoogleDrive.Worker/Dockerfile
          # s3-worker was missing from this matrix, so its image was never
          # published even though TorrenClou.S3.Worker/Dockerfile has always
          # existed. Any deployment splitting the workers into separate
          # services had no image to pull.
          - name: s3-worker
            context: .
            dockerfile: TorrenClou.S3.Worker/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Needed for the arm64 runtime stage. The SDK stage is pinned to
      # $BUILDPLATFORM in every Dockerfile, so .NET itself never compiles under
      # emulation — only the handful of apt/useradd steps in the runtime stage do.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          # type=semver only emits on a tag, and only fires for a tag pushed by a
          # human: GitHub does not start workflow runs from events raised by
          # GITHUB_TOKEN, which is what Release Please tags with. The tag-release
          # job below is what actually applies semver tags to an automated
          # release; these rules cover the manual case.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TorrenClou ${{ matrix.service.name }}
            org.opencontainers.image.description=TorrenClou ${{ matrix.service.name }} — self-hosted torrent-to-cloud
            org.opencontainers.image.vendor=TorrenClou
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://tc.gitnasr.com
            org.opencontainers.image.documentation=https://tc.gitnasr.com/docs

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          platforms: linux/amd64,linux/arm64

  # Deployment is gated on the images above. Dokploy's autoDeploy is off, so a push
  # that fails to build never reaches production — the previous deployment keeps
  # serving. DOKPLOY_DEPLOY_URL is the compose deploy webhook from Dokploy.
  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deployment
        env:
          DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::DOKPLOY_DEPLOY_URL is not set. Add it as a repository secret."
            exit 1
          fi

          status=$(curl -sS -o /tmp/deploy.log -w '%{http_code}' -X POST "$DEPLOY_URL")
          echo "Dokploy responded $status"
          cat /tmp/deploy.log || true

          # Dokploy returns 200 on accept; anything else means the deploy never started.
          if [ "$status" != "200" ]; then
            echo "::error::Dokploy deploy webhook returned $status"
            exit 1
          fi

  # Was its own workflow on the same push trigger, so it raced this one: the
  # combined image could be built from a commit whose own images had just failed
  # to build. Gated on images now, so the all-in-one is only rebuilt from a
  # commit that actually compiles.
  dispatch-combined:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger combined image build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          repository: TorrenClou/deploy
          event-type: build-combined
          client-payload: |
            {
              "repository": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}"
            }

  # Applies the semver tags to a release build.
  #
  # The tag trigger above cannot do this on its own. Release Please creates its
  # tag with GITHUB_TOKEN, and GitHub deliberately does not start workflow runs
  # from events raised by that token, so `on: push: tags` never fires for an
  # automated release. (It does fire for a tag pushed by a human, which is why
  # the trigger stays.)
  #
  # Instead this runs in the same workflow as the build it is tagging: a release
  # commit is a push to main like any other, so the images already exist by the
  # time this job starts. It re-tags them by digest with `imagetools create` —
  # no rebuild, and the semver tag points at exactly the artifact that was
  # tested.
  tag-release:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Needed to regenerate the configuration schema below. Only the release
      # path uses it, so it is set up here rather than in every run.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Is this a release commit?
        id: release
        run: |
          set -euo pipefail
          # Release Please touches the manifest and nothing else does.
          if git diff --name-only HEAD^ HEAD | grep -qx '.release-please-manifest.json'; then
            version=$(jq -r '.["."]' .release-please-manifest.json)
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
            echo "Release commit for ${version}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit; nothing to tag."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The docs site reads this from the release rather than from main, so the
      # published reference always describes a released build rather than
      # whatever is currently on the branch.
      - name: Attach the configuration schema to the release
        if: steps.release.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet build TorrenClou.sln -c Release
          dotnet TorrenClou.API/bin/Release/net9.0/TorrenClou.API.dll --dump-config-schema > config-schema.json
          gh release upload "v${{ steps.release.outputs.version }}" config-schema.json --clobber

      - name: Apply semver tags
        if: steps.release.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          major_minor="${{ steps.release.outputs.major_minor }}"
          prefix=$(echo "${{ env.IMAGE_PREFIX }}" | tr "[:upper:]" "[:lower:]")
          for service in api worker gdrive-worker s3-worker; do
            # IMAGE_PREFIX is github.repository, which preserves the owner's
            # casing ("TorrenClou/backend"), and Docker rejects an uppercase
            # repository name. The matrix build above never hits this because
            # docker/metadata-action lowercases for you; this does not.
            # The identical bug failed the first frontend release.
            image="${{ env.REGISTRY }}/${prefix}/${service}"
            echo "Tagging ${image} as ${version} and ${major_minor}"
            docker buildx imagetools create \
              --tag "${image}:${version}" \
              --tag "${image}:${major_minor}" \
              "${image}:sha-${{ github.sha }}"
          done
