name: Retag a release

# Repairs a release whose semver tagging failed.
#
# v2.0.0 shipped without :2.0.0 or :2.0 images because the tag-release job ran a
# release-asset upload before the tagging and that upload 403'd, skipping
# everything behind it. The ordering is fixed, but a release that already
# happened still needs its tags applied.
#
# This is a separate workflow rather than an input on the build, for two
# reasons. It must not rebuild anything — the images for that version already
# exist and rebuilding would produce different ones from newer source. And it
# must promote the images built *for that release commit*, not whatever :latest
# points at now, because :latest has moved on. Tagging current main as an older
# version is worse than having no tag at all.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to retag, without the v, e.g. 2.0.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version }}"

          # The tag has to exist. Retagging a version that was never released
          # would invent one.
          if ! commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/v${version}" --jq .sha 2>/dev/null); then
            echo "::error::No tag v${version} in ${GITHUB_REPOSITORY}."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "source_tag=sha-${commit}" >> "$GITHUB_OUTPUT"
          echo "v${version} is ${commit}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the semver tags
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"
          major_minor="${{ steps.resolve.outputs.major_minor }}"
          source_tag="${{ steps.resolve.outputs.source_tag }}"
          # github.repository preserves the owner's casing; Docker rejects it.
          prefix=$(echo "${GITHUB_REPOSITORY}" | tr "[:upper:]" "[:lower:]")

          for service in api worker gdrive-worker s3-worker; do
            image="ghcr.io/${prefix}/${service}"

            # Fail loudly rather than silently tagging nothing if the release
            # build never pushed this service.
            if ! docker buildx imagetools inspect "${image}:${source_tag}" > /dev/null 2>&1; then
              echo "::error::${image}:${source_tag} does not exist. That release may predate this service."
              exit 1
            fi

            echo "Tagging ${image} as ${version} and ${major_minor} from ${source_tag}"
            docker buildx imagetools create \
              --tag "${image}:${version}" \
              --tag "${image}:${major_minor}" \
              "${image}:${source_tag}"
          done

      - name: Confirm the tags resolve
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"
          prefix=$(echo "${GITHUB_REPOSITORY}" | tr "[:upper:]" "[:lower:]")
          for service in api worker gdrive-worker s3-worker; do
            docker buildx imagetools inspect "ghcr.io/${prefix}/${service}:${version}" \
              --format '{{.Name}} -> {{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}'
          done
