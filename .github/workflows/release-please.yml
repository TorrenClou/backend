name: Release Please

# Accumulates merged commits into a release pull request. Merging that PR tags
# the release and publishes the notes; nothing is released by pushing to main.
#
# The version lives in .release-please-manifest.json and is written into
# Directory.Build.props, which is what the build actually reads. There was no
# release process before this: the repo has never had a git tag, so the
# type=semver image tags in docker-build.yml could never fire.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
